# fly.toml - Fly.io deployment configuration for DentalBoutique RAG chatbot
# Docs: https://fly.io/docs/reference/configuration/

app = "dentalboutique"
primary_region = "yyz"

[build]
  # Uses the existing Dockerfile at the project root

[env]
  VECTOR_STORE_PATH      = "/data/chroma"
  MODEL_CACHE_DIR        = "/data/model_cache"
  FEEDBACK_FILE_PATH     = "/data/feedback.jsonl"
  EXTRACTED_IMAGES_DIR   = "/app/static/indexed_images"
  TOP_K                  = "5"
  IMAGE_TOP_K            = "3"
  IMAGE_MIN_SIMILARITY   = "0.22"
  FEEDBACK_TOP_K         = "2"
  FEEDBACK_MIN_SIMILARITY = "0.35"
  LLM_MODEL              = "openai/gpt-4o"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus     = 2
  memory   = "4gb"

[[mounts]]
  source      = "dentalboutique_data"
  destination = "/data"
