<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentalBoutique – Ask a question</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>DentalBoutique</h1>
      <p class="tagline">Ask a question about our services, hours, or policies</p>
      <div class="role-selector">
        <span class="role-label">I am:</span>
        <button type="button" class="role-btn active" data-role="patient" aria-pressed="true">Patient</button>
        <button type="button" class="role-btn" data-role="staff" aria-pressed="false">Staff</button>
      </div>
    </header>

    <main class="chat-main">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" aria-label="Send a message">
        <label for="user-input" class="sr-only">Your question</label>
        <input type="text" id="user-input" name="message" placeholder="Type your question…" autocomplete="off" required>
        <button type="submit" id="submit-btn">Send</button>
      </form>
    </main>
  </div>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const submitBtn = document.getElementById('submit-btn');
    const roleBtns = document.querySelectorAll('.role-btn');

    let currentRole = 'patient';
    const chatHistory = [];

    roleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        roleBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        currentRole = btn.dataset.role;
      });
    });

    async function submitFeedback(payload, feedback, controls) {
      try {
        const res = await fetch('/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, feedback })
        });
        if (!res.ok) throw new Error('feedback failed');
        controls.classList.add('submitted');
      } catch (_) {
        controls.classList.add('error');
      }
    }

    function appendMessage(content, isUser, images = [], feedbackPayload = null) {
      const div = document.createElement('div');
      div.className = isUser ? 'message user' : 'message assistant';
      const inner = document.createElement('div');
      inner.className = 'message-inner';
      inner.textContent = content;
      div.appendChild(inner);

      if (!isUser && Array.isArray(images) && images.length > 0) {
        const imageList = document.createElement('div');
        imageList.className = 'message-images';
        images.forEach(img => {
          if (!img.url) return;
          const image = document.createElement('img');
          image.className = 'message-image';
          image.src = img.url;
          image.alt = img.image_name || 'Relevant document image';
          image.loading = 'lazy';
          imageList.appendChild(image);
        });
        if (imageList.childElementCount > 0) {
          div.appendChild(imageList);
        }
      }

      if (!isUser && feedbackPayload) {
        const controls = document.createElement('div');
        controls.className = 'feedback-controls';

        const label = document.createElement('span');
        label.className = 'feedback-label';
        label.textContent = 'Was this helpful?';

        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'feedback-btn';
        upBtn.textContent = '👍';
        upBtn.setAttribute('aria-label', 'Thumbs up');

        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'feedback-btn';
        downBtn.textContent = '👎';
        downBtn.setAttribute('aria-label', 'Thumbs down');

        const lockButtons = () => {
          upBtn.disabled = true;
          downBtn.disabled = true;
        };

        upBtn.addEventListener('click', async () => {
          lockButtons();
          upBtn.classList.add('selected');
          await submitFeedback(feedbackPayload, 'up', controls);
        });

        downBtn.addEventListener('click', async () => {
          lockButtons();
          downBtn.classList.add('selected');
          await submitFeedback(feedbackPayload, 'down', controls);
        });

        controls.appendChild(label);
        controls.appendChild(upBtn);
        controls.appendChild(downBtn);
        div.appendChild(controls);
      }

      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.textContent = loading ? '…' : 'Send';
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      userInput.value = '';
      appendMessage(message, true);
      setLoading(true);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            role: currentRole,
            history: chatHistory.slice(-8)
          })
        });
        const data = await res.json();
        const text = data.response || (res.ok ? 'No response.' : 'Something went wrong.');
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: text });
        appendMessage(
          text,
          false,
          data.images || [],
          {
            question: message,
            answer: text,
            role: currentRole,
            images: data.images || []
          }
        );
      } catch (err) {
        appendMessage('Unable to send. Please try again.', false);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
